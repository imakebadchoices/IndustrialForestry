name: Wiki

# Builds the Forestry: CE wiki (static site + breeding explorer) from source and
# deploys it to GitHub Pages. The species data is produced by the mod's own datagen
# (`runData`) reading the live registry, then folded together with the on-disk
# datapack species by the Python generator — so the generated snapshot is a build
# artifact and is never committed.
#
# Deploy target (on the fork this runs in): https://<owner>.github.io/<repo>/
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".
on:
  workflow_dispatch:
  push:
    branches: [ '1.21.1-custom' ]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Use Gradle cache for faster builds
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r wiki/requirements.txt

      - name: Datagen — dump live species registry
        run: ./gradlew runData --console=plain --max-workers 1

      - name: Build site + explorer
        # Renders markdown, generates the genetics tables, deploys images, and bundles
        # the explorer (fetches pinned Mermaid from the npm CDN — needs network).
        run: python3 wiki/build.py --out wiki/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
