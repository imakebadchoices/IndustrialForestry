name: Wiki

# Builds the Forestry: CE wiki (static site + breeding explorer) from source and
# deploys it to GitHub Pages. Since genetics are data-driven, every species is on-disk
# JSON: base species datagen'd under src/generated by `runData`, bundled add-ons under
# src/main/resources. The Python generator reads them directly — no registry dump.
#
# Deploy target (on the fork this runs in): https://<owner>.github.io/<repo>/
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".
on:
  workflow_dispatch:
  push:
    branches: [ '1.21.1-custom' ]
    # Also rebuild on code/build changes so the jars hosted under /downloads stay current.
    paths:
      - 'wiki/**'
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/wiki.yml'

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Use Gradle cache for faster builds
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r wiki/requirements.txt

      - name: Build site + explorer
        # Renders markdown, generates the genetics tables, deploys images, and bundles
        # the explorer (fetches pinned Mermaid from the npm CDN — needs network).
        run: python3 wiki/build.py --out wiki/site

      # Build the mod jars and host them on the site under /downloads with stable names, so the Downloads page's
      # links resolve. Runs after the site build (build.py only creates wiki/site; it never wipes it).
      - name: Build jars
        run: ./gradlew jar forestryExtrabeesJar forestryBeegisticsJar forestryBeeripheralsJar forestryModernBeesJar --max-workers 1

      - name: Stage jars for hosting
        run: |
          set -euo pipefail
          mkdir -p wiki/site/downloads
          stage() { cp "$1" "wiki/site/downloads/$2"; echo "  $2 <- $1"; }
          # Main mod jar only (exclude the sources/api/javadoc classifier jars, which aren't built here anyway).
          stage "$(ls build/libs/forestry-1.21.1-*.jar | grep -vE '(-sources|-api|-javadoc)\.jar$')" forestry.jar
          stage build/libs/forestry-extrabees-1.21.1-*.jar   forestry-extrabees.jar
          stage build/libs/forestry-beegistics-1.21.1-*.jar  forestry-beegistics.jar
          stage build/libs/forestry-beeripherals-1.21.1-*.jar forestry-beeripherals.jar
          stage build/libs/forestry-modernbees-1.21.1-*.jar  forestry-modernbees.jar

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
