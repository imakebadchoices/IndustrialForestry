name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build jar and run GameTests
    if: "! contains(toJSON(github.event.commits.*.message), '[ci skip]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Produce the published jars (base Forestry + every add-on). Kept separate from the tests so a test failure
      # still leaves the jars to inspect, and so the build vs. test failure is obvious in the step list.
      - name: Build jars
        run: ./gradlew jar forestryExtrabeesJar forestryBeegisticsJar forestryBeeripheralsJar forestryModernBeesJar --max-workers 1

      # The GameTest suites run only via their gameTestServer runs (enabled-namespaces set in build.gradle) —
      # `build`/`test` never execute them. They run headless on the dedicated-server dist, so no display is needed.
      # There are two: runGameTestServer loads only the forestry mod + forestry namespace (upstream's core-only
      # invariants), and runGameTestAddons loads every mod but enables only the add-on namespaces. Both finish in
      # well under a minute. This is a fresh checkout, so the run tasks compile the (unchanged) sources themselves.
      - name: Run GameTests
        run: ./gradlew runGameTestServer runGameTestAddons --max-workers 1

      - name: Upload jar
        # Publish the jars even when the GameTests fail, so the artifacts are always available for the run.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Forestry
          path: build/libs/
