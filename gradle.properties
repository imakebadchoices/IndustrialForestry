# CC: Tweaked. SquidDev's maven only publishes the 1.21(.0) dev API jar, which is what we compile against - the
# peripheral API we use is unchanged in 1.21.1. The runnable mod is the real 1.21.1 build from Modrinth: the CC
# 1.21(.0) jar hard-requires NeoForge [21.0,21.1) and would be rejected on our 21.1 runtime. Modrinth's version
# NUMBER route is loader-ambiguous (it resolves to the 1.20.1 jar!), so we pin the NeoForge build by version ID.
ccApiBranch=1.21
ccApiVersion=1.111.0
ccModrinthVersionId=h6qYZ1UT
ccVersionRange=[1.115,)
