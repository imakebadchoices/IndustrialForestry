tasks.named('wrapper', Wrapper).configure {
	distributionType = Wrapper.DistributionType.BIN
}

group = 'thedarkcolour.forestry'
version = forestryVersion
base.archivesName = "forestry-$minecraftVersion"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.toolchain.vendor = JvmVendorSpec.JETBRAINS

// Standalone Extra Bees add-on. A second source set (not a subproject) built into its own mod jar
// (forestry-extrabees) that depends on the main forestry output and loads alongside it in dev runs.
// Declared before the neoForge block so `mods` / `addModdingDependenciesTo` can reference it.
sourceSets {
	extrabees {}
	// Standalone Beegistics add-on (Applied Energistics 2 integration): its own mod jar, depends on the main
	// forestry output + AE2, loaded alongside forestry in dev runs.
	beegistics {}
	// Standalone Beeripherals add-on (CC: Tweaked integration): naturalist-chest peripheral, its own mod jar,
	// depends on the main forestry output + the CC API, loaded alongside forestry in dev runs.
	beeripherals {}
	// Standalone Modern Bees add-on (Modern Industrialization integration): the tin drill + MI fuel/furnace
	// mappings. Its own mod jar, depends on the main forestry output (all MI interop is data-driven), loaded
	// alongside forestry in dev runs.
	modernbees {}
}

neoForge {
	version = "$forgeVersion"

	// Core Forestry's AT plus the Beegistics add-on's (which un-finals Slot.x/y). The add-on ships its own AT in its
	// jar via [[accessTransformers]] in its mods.toml; it is listed here too so the shared dev run applies it.
	accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg', 'src/beegistics/resources/META-INF/accesstransformer.cfg')
	validateAccessTransformers = true

	// Add Parchment parameter mappings
	parchment {
		mappingsVersion = project.mappingsVersion
		minecraftVersion = project.minecraftVersion
	}

	mods {
		forestry {
			sourceSet sourceSets.main
			// GameTest suite lives in src/test (forestry.gametest). It is part of the forestry mod so the
			// gameTestServer run loads it, but stays out of the published jar (jar/apiJar use main only).
			sourceSet sourceSets.test
		}
		// Separate mod at runtime: its own @Mod("extrabees") + neoforge.mods.toml, loaded alongside forestry.
		extrabees {
			sourceSet sourceSets.extrabees
		}
		// Separate mod at runtime: its own @Mod("beegistics") + neoforge.mods.toml, loaded alongside forestry.
		beegistics {
			sourceSet sourceSets.beegistics
		}
		// Separate mod at runtime: its own @Mod("beeripherals") + neoforge.mods.toml, loaded alongside forestry.
		beeripherals {
			sourceSet sourceSets.beeripherals
		}
		// Separate mod at runtime: its own @Mod("modernbees") + neoforge.mods.toml, loaded alongside forestry.
		modernbees {
			sourceSet sourceSets.modernbees
		}
	}

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			jvmArgument '-XX:+AllowEnhancedClassRedefinition'
			jvmArgument '-XX:+IgnoreUnrecognizedVMOptions'
		}

		client {
			client()
		}

		server {
			server()
			gameDirectory.set(project.layout.projectDirectory.dir('run/server'))
			programArgument '--nogui'
		}

		data {
			data()
			programArguments.addAll('--mod', 'forestry', '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath)
		}

		// Extra Bees add-on datagen (centrifuge / squeezer recipes). Run via `gradlew runDataExtrabees`.
		dataExtrabees {
			data()
			programArguments.addAll('--mod', 'extrabees', '--all', '--output', file('src/extrabees/generated/').absolutePath, '--existing', file('src/main/resources/').absolutePath, '--existing', file('src/extrabees/resources/').absolutePath)
		}

		// Core Forestry GameTest suite (src/test): multiblock inventory conservation, genetics baseline, data-driven
		// bee effect oracle, etc. Runs via `gradlew runGameTestServer`. Only the `forestry` mod is loaded and only the
		// `forestry` namespace is enabled, so these keep upstream's core-only invariants intact (e.g. "exactly 5 bee
		// effect primitive types") without the add-ons' extra species/effects/alleles/recipes tripping them. The
		// add-on tests run separately via `runGameTestAddons`.
		gameTestServer {
			type = "gameTestServer"
			loadedMods = [mods.forestry]
			gameDirectory.set(project.layout.projectDirectory.dir('run/gametest'))
			systemProperty 'neoforge.enabledGameTestNamespaces', 'forestry'
			// Forwards `-Pforestry.genomeBaseline=generate` to the forked gametest JVM so GenomeBaselineTest
			// can (re)generate its golden-master snapshot. Empty/absent => assert mode.
			systemProperty 'forestry.genomeBaseline', providers.gradleProperty('forestry.genomeBaseline').getOrElse('')
		}

		// Add-on GameTest suite (beegistics autocrafting incl. many-genome + full-tree stress tests, Extra Bees effect
		// behaviour + content, naturalist-chest peripheral, ...). Runs via `gradlew runGameTestAddons` with every mod
		// loaded (add-ons need forestry) but only the add-on namespaces enabled, so the core-only invariant tests above
		// are not executed in this add-on-contaminated world. The whole suite finishes in well under a minute.
		gameTestAddons {
			type = "gameTestServer"
			gameDirectory.set(project.layout.projectDirectory.dir('run/gametest-addons'))
			systemProperty 'neoforge.enabledGameTestNamespaces', 'extrabees,beegistics,beeripherals,modernbees'
		}
	}

	// src/test has no Minecraft/NeoForge on its classpath by default — moddev only wires that into source sets
	// it's told about. Without this the gametest sources won't compile.
	addModdingDependenciesTo sourceSets.test
	// The Extra Bees add-on source set likewise needs Minecraft/NeoForge on its classpath.
	addModdingDependenciesTo sourceSets.extrabees
	// The Beegistics add-on source set likewise needs Minecraft/NeoForge on its classpath.
	addModdingDependenciesTo sourceSets.beegistics
	// The Beeripherals add-on source set likewise needs Minecraft/NeoForge on its classpath.
	addModdingDependenciesTo sourceSets.beeripherals
	// The Modern Bees add-on source set likewise needs Minecraft/NeoForge on its classpath.
	addModdingDependenciesTo sourceSets.modernbees
}

// The test source set holds GameTests (run via runGameTestServer), not JUnit tests, so the standard `test` task
// discovers nothing. Gradle 9 fails the build on no-discovered-tests by default; opt out so `./gradlew build` is green.
tasks.named('test', Test) {
	failOnNoDiscoveredTests = false
}

