dependencies {
	// JEI OPTIONAL
	compileOnly "mezz.jei:jei-$minecraftVersion-neoforge-api:$jeiVersion"
	runtimeOnly "mezz.jei:jei-$minecraftVersion-neoforge:$jeiVersion"
	// KubeJS OPTIONAL
	implementation "dev.architectury:architectury-neoforge:${architecturyVersion}"
	implementation "dev.latvian.mods:rhino:${rhinoVersion}"
	implementation "dev.latvian.mods:kubejs-neoforge:${kubejsVersion}"
	// Curios Optional
	implementation "top.theillusivec4.curios:curios-neoforge:${curiosVersion}+${minecraftVersion}"
	// Ponder OPTIONAL
	implementation("net.createmod.ponder:ponder-neoforge:${ponderVersion}+mc${minecraftVersion}")
	// PATCHOULI REQUIRED
	compileOnly "vazkii.patchouli:Patchouli:$patchouliVersion-NEOFORGE:api"
	runtimeOnly "vazkii.patchouli:Patchouli:$patchouliVersion-NEOFORGE"
	// ModKit DEV ONLY
	implementation 'com.github.thedarkcolour:ModKit:51b8760'
	// CC: Tweaked (used by the Beeripherals add-on, not core forestry). Kept as a runtime dep here so the dev runs
	// load the real 1.21.1 build alongside the add-on - the peripheral can then be wrapped by a computer in-game
	// (and in the gametest server).
	runtimeOnly "maven.modrinth:cc-tweaked:$ccModrinthVersionId"
	// Applied Energistics 2 (used by the Beegistics add-on, not core forestry). Kept as a runtime dep here so the
	// dev runs load AE2 + its mandatory guideme dependency alongside the add-on.
	runtimeOnly "maven.modrinth:ae2:$ae2Version"
	runtimeOnly "maven.modrinth:guideme:$guidemeVersion"

	// Extra Bees add-on compiles + runs against the full forestry output (its internal public classes) -
	// the same coupling the original Binnie Extra Bees always had. No forestry.api changes required.
	extrabeesImplementation sourceSets.main.output

	// Beegistics add-on: full forestry output + AE2 (its whole reason to exist) + the JEI API for its plugin.
	beegisticsImplementation sourceSets.main.output
	beegisticsCompileOnly "maven.modrinth:ae2:$ae2Version"
	beegisticsCompileOnly "mezz.jei:jei-$minecraftVersion-neoforge-api:$jeiVersion"

	// Beeripherals add-on: full forestry output + the CC: Tweaked peripheral API (its whole reason to exist).
	beeripheralsImplementation sourceSets.main.output
	beeripheralsCompileOnly "cc.tweaked:cc-tweaked-$ccApiBranch-forge-api:$ccApiVersion"

	// Modern Bees add-on: full forestry output only. All Modern Industrialization interop is data-driven
	// (mod_loaded-gated recipes + MI-namespaced datamaps), so there is no MI compile dependency.
	modernbeesImplementation sourceSets.main.output
}

