# ApiaristTerminalScreen positions its custom analyzer slots outside AE2's style-driven layout, so it needs to
# write Slot.x/y directly (mirrors AE2's own access transformer on the same fields). Shipped in the add-on jar
# rather than core Forestry so core stays vanilla-upstream-compatible.
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y
